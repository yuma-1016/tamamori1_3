<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Teachable Machine Audio Test</title>
</head>
<body>
  <h1>Teachable Machine 音声認識テスト</h1>
  <button type="button" onclick="init()">マイクを開始</button>
  <audio id="Audio1" src="../audio/01.mp3"></audio>
  <audio id="Audio2" src="../audio/02.mp3"></audio>
  <audio id="Audio3" src="../audio/03.mp3"></audio>
  <audio id="Audio4" src="../audio/04.mp3"></audio>
  <audio id="Audio5" src="../audio/05.mp3"></audio>
  <audio id="Audio6" src="../audio/06.mp3"></audio>
  <div id="label-container"></div>

  <!-- TensorFlow.js と Speech Commands ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>

  <script>
    // 出力したTeachable MachineのURL
    const URL = "https://teachablemachine.withgoogle.com/models/gCFPnk_3A/";

    let recognizer;
    let scores = [];

    const currentAudio = {
      0 : 'Audio1',
      1 : 'Audio2',
      2 : 'Audio3',
      3 : 'Audio4',
      4 : 'Audio5',
      5 : 'Audio6'
     }; 
    let currentPlayingIndex = -1;

    async function createModel() {
      const checkpointURL = URL + "model.json";
      const metadataURL = URL + "metadata.json";

      const recognizer = speechCommands.create(
        "BROWSER_FFT",
        undefined,
        checkpointURL,
        metadataURL
      );

      await recognizer.ensureModelLoaded();
      return recognizer;
    }

    async function init() {
      recognizer = await createModel();
      const classLabels = recognizer.wordLabels(); // 学習したクラス名の一覧を取得
      const labelContainer = document.getElementById("label-container");
      
      for (let i = 0; i < classLabels.length; i++) {
        labelContainer.appendChild(document.createElement("div"));
      }

      // リアルタイム認識開始
      recognizer.listen(result => {
        scores = result.scores;
        for (let i = 0; i < classLabels.length; i++) {
          const classPrediction = classLabels[i] + ": " + scores[i].toFixed(2);
          labelContainer.childNodes[i].innerHTML = classPrediction;
        }
      }, {
        includeSpectrogram: true,
        probabilityThreshold: 0.75, // 判定のしきい値（0.75以上で反応）
        invokeCallbackOnNoiseAndUnknown: true,
        overlapFactor: 0.50
      });
      let maxScore = 0;
      let maxIndex = 0;
      for(let i = 0; i < classLabels.length; i++){
        if(scores[i] > maxScore){
          maxScore = scores[i];
          maxIndex = i;
        }
      }

      if(maxIndex !== currentPlayingIndex){
        for(let key in currentAudio){
          stopSound(key);
        }
        if(currentAudio[maxIndex]){
          playSound(maxIndex);
        }
        currentPlayingIndex = maxIndex;
      }
    }

    function playSound(currentindex) {
      document.getElementById(currentAudio[currentindex]).play();
    }
    function stopSound(currentindex) {
      document.getElementById(currentAudio[currentindex]).pause();
      document.getElementById(currentAudio[currentindex]).currentTime = 0;
    }
  </script>
</body>
</html>
