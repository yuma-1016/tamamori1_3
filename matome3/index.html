<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サウンドマスク - 環境音を穏やかに</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#475569',
            bgLight: '#f8fafc',
            toneLow: '#60a5fa',   // 低音色 (ブルー)
            toneMid: '#fbbf24',   // 中音色 (アンバー)
            toneHigh: '#34d399',  // 高音色 (エメラルド)
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-bgLight text-slate-700 min-h-screen flex items-center justify-center antialiased selection:bg-slate-200 relative overflow-y-auto">

  <!-- ふんわりとした背景の光 -->
  <div class="fixed inset-0 pointer-events-none -z-10 transition-colors duration-1000" id="bgAmbientLight">
    <div id="ambientOrb" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[40rem] h-[40rem] bg-slate-200/50 rounded-full blur-[100px] transition-all duration-1000"></div>
  </div>

  <main class="w-full max-w-md mx-auto p-4 py-8 z-10">
    
    <!-- メインコントロールカード -->
    <div class="bg-white/60 backdrop-blur-2xl rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white/80 p-8 flex flex-col items-center relative overflow-hidden">
      
      <!-- ステータス表示 -->
      <div class="text-center mb-8">
        <h1 class="text-sm font-medium tracking-widest text-slate-400 mb-6">環境サウンドマスク</h1>
        
        <!-- アイコンサークル -->
        <div id="themeAvatar" class="w-32 h-32 mx-auto rounded-full bg-slate-50 border-4 border-slate-100 flex items-center justify-center shadow-inner transition-all duration-700 mb-6 text-slate-300 relative overflow-hidden">
          <canvas id="visualizerCanvas" class="absolute inset-0 w-full h-full opacity-30"></canvas>
          <i id="themeAvatarIcon" class="ph-fill ph-speaker-none text-5xl relative z-10 transition-all duration-500"></i>
        </div>

        <h2 id="currentThemeTitle" class="text-2xl font-bold text-slate-700 tracking-tight mb-2 transition-colors duration-500">
          待機中
        </h2>
        <p id="currentThemeDesc" class="text-sm text-slate-500">
          スタートを押すと、環境音のカバーを開始します。
        </p>
      </div>

      <!-- スタートボタン -->
      <button id="toggleListenBtn" class="w-full py-4 rounded-2xl bg-slate-800 hover:bg-slate-700 text-white font-medium shadow-lg shadow-slate-800/20 active:scale-95 transition-all flex items-center justify-center gap-2 mb-8">
        <i id="listenBtnIcon" class="ph-fill ph-play text-lg"></i>
        <span id="listenBtnText">スタート</span>
      </button>

      <!-- 詳細設定（アコーディオン） -->
      <div class="w-full border-t border-slate-200/60 pt-6">
        <button id="settingsToggleBtn" class="w-full flex items-center justify-between text-sm text-slate-500 hover:text-slate-700 transition-colors">
          <span class="flex items-center gap-2"><i class="ph-fill ph-sliders-horizontal"></i> 音の調整</span>
          <i id="settingsToggleIcon" class="ph-bold ph-caret-down transition-transform"></i>
        </button>

        <div id="settingsPanel" class="hidden mt-6 space-y-5">
          <!-- 音量 -->
          <div>
            <div class="flex justify-between items-center text-xs mb-2 text-slate-500">
              <span>全体の音量</span>
              <span id="masterVolumeValText" class="font-medium text-slate-700">50%</span>
            </div>
            <input id="masterVolumeSlider" type="range" min="5" max="100" value="50" class="w-full accent-slate-600 bg-slate-200 rounded-lg h-1.5 cursor-pointer">
          </div>

          <!-- 敏感さ -->
          <div class="relative">
            <div class="flex justify-between items-center text-xs mb-2 text-slate-500">
              <span class="flex items-center gap-1.5">
                <span>反応の敏感さ</span>
                <!-- はてなボタン -->
                <button type="button" id="sensitivityHelpBtn" class="w-4 h-4 rounded-full bg-slate-200 hover:bg-slate-300 text-slate-600 flex items-center justify-center text-[10px] font-bold transition-colors cursor-pointer">
                  ?
                </button>
              </span>
              <span id="thresholdValText" class="font-medium text-slate-700">70%</span>
            </div>

            <!-- 浮かび上がる説明カード (初期状態はhidden) -->
            <div id="sensitivityTooltip" class="hidden mb-3 p-3 rounded-xl bg-slate-800 text-slate-100 text-[11px] leading-relaxed shadow-lg transition-all animate-fade-in relative z-20">
              <p class="font-bold mb-1 text-slate-200">音の切り替わりやすさの設定です</p>
              <ul class="space-y-1 text-slate-300">
                <li>・<strong class="text-white">下げる (〜50%)</strong>：小さな物音でもすぐ敏感に反応して音が切り替わります。</li>
                <li>・<strong class="text-white">上げる (80%〜)</strong>：はっきりした大きな音だけを慎重に拾い、誤切り替えを防ぎます。</li>
              </ul>
            </div>

            <input id="thresholdSlider" type="range" min="30" max="95" value="70" class="w-full accent-slate-600 bg-slate-200 rounded-lg h-1.5 cursor-pointer">
          </div>
          
          <p class="text-[10px] text-slate-400 text-center pt-2">
            ※モデルの読み込みはバックグラウンドで自動実行されます。
          </p>
        </div>
      </div>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
